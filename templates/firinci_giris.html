<!DOCTYPE html>
<html lang="tr">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Fırıncı Girişi - UrfaEkmek</title>

    <link rel="stylesheet"
          href="/static/style.css">

</head>

<body>

<header>

    <h1>🥖 UrfaEkmek</h1>

    <p>🏪 Fırıncı Paneli</p>

</header>


<main>

    <section class="form-container">

        <h2>🔐 Fırıncı Girişi</h2>


        {% if hata %}

            <div class="success">
                {{ hata }}
            </div>

        {% endif %}


        <form method="POST">


            <label for="kullanici_adi">
                👤 Kullanıcı Adı
            </label>

            <input
                id="kullanici_adi"
                type="text"
                name="kullanici_adi"
                placeholder="Kullanıcı adınız"
                required
            >


            <label for="sifre">
                🔑 Şifre
            </label>

            <input
                id="sifre"
                type="password"
                name="sifre"
                placeholder="Şifreniz"
                required
            >


            <button type="submit">

                🔐 Giriş Yap

            </button>

        </form>


        <div style="text-align:center; margin-top:25px;">

            <a href="/firinci">
                🏪 Fırıncı Başvurusu Yap
            </a>

        </div>


        <br>


        <div style="text-align:center;">

            <a href="/">
                ← Ana Sayfaya Dön
            </a>

        </div>

    </section>

</main>

</body>

</html>
