<!DOCTYPE html><html lang="tr"><head>
    <meta charset="UTF-8"><meta name="viewport"
      content="width=device-width, initial-scale=1.0">

<title>Admin Girişi - UrfaEkmek</title>

<link rel="stylesheet"
      href="/static/style.css">

</head><body><header><h1>🔐 UrfaEkmek</h1>

<p>Yönetici Girişi</p>

</header><main><section class="form-container">

    <h2>🔐 Admin Paneli</h2>

    {% if hata %}

        <div class="success">
            {{ hata }}
        </div>

    {% endif %}

    <form method="POST">

        <label for="kullanici">
            👤 Kullanıcı Adı
        </label>

        <input
            id="kullanici"
            type="text"
            name="kullanici"
            placeholder="Kullanıcı adı"
            required
        >

        <label for="sifre">
            🔑 Şifre
        </label>

        <input
            id="sifre"
            type="password"
            name="sifre"
            placeholder="Şifre"
            required
        >

        <button type="submit">
            🔐 Giriş Yap
        </button>

    </form>

    <div style="text-align:center; margin-top:25px;">

        <a href="/">
            ← Ana Sayfaya Dön
        </a>

    </div>

</section>

</main></body></html>
